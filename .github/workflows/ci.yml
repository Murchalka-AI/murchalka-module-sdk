name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  test:
    name: Test and conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: >-
          dotnet nuget update source github
          --username "${GITHUB_ACTOR}"
          --password "${PACKAGE_TOKEN}"
          --store-password-in-clear-text
          --configfile NuGet.Config

      - name: Restore dependencies
        run: dotnet restore Murchalka.ModuleSdk.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build Murchalka.ModuleSdk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Murchalka.ModuleSdk.slnx --configuration Release --no-build --no-restore

      - name: Run repository conformance
        run: >-
          dotnet run
          --project src/Murchalka.ModuleSdk.Testing
          --configuration Release
          --no-build
          --no-restore
          -- samples/hello-world

  package:
    name: Verify NuGet packages
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Authenticate to GitHub Packages
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: >-
          dotnet nuget update source github
          --username "${GITHUB_ACTOR}"
          --password "${PACKAGE_TOKEN}"
          --store-password-in-clear-text
          --configfile NuGet.Config

      - name: Restore dependencies
        run: dotnet restore Murchalka.ModuleSdk.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build Murchalka.ModuleSdk.slnx --configuration Release --no-restore

      - name: Pack
        shell: bash
        run: |
          projects=(
            src/Murchalka.ModuleSdk.Abstractions/Murchalka.ModuleSdk.Abstractions.csproj
            src/Murchalka.ModuleSdk.ProcessHost/Murchalka.ModuleSdk.ProcessHost.csproj
            src/Murchalka.ModuleSdk.Node/Murchalka.ModuleSdk.Node.csproj
            src/Murchalka.ModuleSdk.NodeProcessHost/Murchalka.ModuleSdk.NodeProcessHost.csproj
            src/Murchalka.ModuleSdk.Testing/Murchalka.ModuleSdk.Testing.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "${project}" --configuration Release --no-build --no-restore --output artifacts/packages
          done

      - name: Validate multi-target packager
        run: python3 -m py_compile packaging/package_multi_target.py

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: sdk-nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14
